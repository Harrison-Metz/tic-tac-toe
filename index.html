<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" defer>
    <script src="script.js" defer></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="game-layout">
            <div class="playerNamesBox">
                <input type="text" id="player1" placeholder="Player 1 Name">
                <input type="text" id="player2" placeholder="Player 2 Name">
                <button id="startButton">Start Game</button>
            </div>
            <div class="board-wrapper">
                <h1 class="playerTurnBox"></h1>
                <div class="board"></div>
            </div>
            <div class="messageBox">
                <h1 class="message"></h1>
                <button class="resetButton">Reset Game</button>
            </div>
        </div>
    </div>
</body>
</html>
